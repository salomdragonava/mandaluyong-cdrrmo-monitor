name: Mandaluyong Unified Weather Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: mandaluyong-unified-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run PAGASA check
        run: python tests/check_pagasa.py

      - name: Run Mandaluyong flood check
        run: python tests/check_facebook.py

      - name: Install radar dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright pillow
          python -m playwright install chromium --with-deps

      - name: Run radar collection and threat analysis
        run: |
          python tests/radar_light.py
          python tests/radar_threat.py

      - name: Run 3-day flood assessment
        run: python tests/assessment_monitor.py

      - name: Verify assessment alert
        run: |
          test -s assessment_alert.txt || { echo "assessment_alert.txt was not generated"; exit 1; }
          echo "Assessment alert generated successfully."

      - name: Build unified PAGASA-style status
        run: python tests/unified_monitor.py

      - name: Verify unified alert
        run: |
          test -s combined_alert.txt || { echo "combined_alert.txt was not generated"; exit 1; }
          echo "Unified alert generated successfully."

      - name: Send single scheduled status notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          TELEGRAM_TEXT="$(<combined_alert.txt)"
          curl --fail --silent --show-error \
            --request POST \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TELEGRAM_TEXT}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"

      - name: Send escalation notification only when needed
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          if [ -s escalation_alert.txt ]; then
            TELEGRAM_TEXT="$(<escalation_alert.txt)"
            curl --fail --silent --show-error \
              --request POST \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${TELEGRAM_TEXT}" \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
          else
            echo "No meaningful escalation detected."
          fi

      - name: Save monitoring and assessment state to repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Snapshot runtime-generated state before refreshing the branch. A run may
          # have started from an older commit while another run advanced main.
          state_dir="$(mktemp -d)"
          state_files=(
            pagasa_state.json
            flood_state.json
            monitor_notification_state.json
            radar_state.json
            radar_map_state.json
            radar_threat_state.json
            radar_notification_state.json
            assessment_history.json
            assessment_state.json
            assessment_log.json
          )
          for file in "${state_files[@]}"; do
            if [ -f "$file" ]; then cp "$file" "$state_dir/$file"; fi
          done

          # Always base the state commit on the current remote main, rather than
          # rebasing generated JSON onto an arbitrary older workflow checkout.
          git fetch origin main
          git reset --hard origin/main

          for file in "${state_files[@]}"; do
            if [ -f "$state_dir/$file" ]; then cp "$state_dir/$file" "$file"; fi
          done

          git add "${state_files[@]}"
          if git diff --cached --quiet; then
            echo "No repository state changes."
            exit 0
          fi

          git commit -m "Update unified monitoring and assessment state"
          git push origin HEAD:main
