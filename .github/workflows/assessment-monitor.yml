name: Mandaluyong 3-Day Flood Assessment

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

concurrency:
  group: mandaluyong-assessment-monitor
  cancel-in-progress: false

jobs:
  assess:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run rolling 3-day assessment
        run: python tests/assessment_monitor.py

      - name: Send assessment with monitor notifications
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -s assessment_alert.txt ]; then
            curl --fail --silent --show-error \
              --request POST \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text@assessment_alert.txt" \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
          else
            echo 'No assessment notification generated.'
          fi

      - name: Commit assessment state
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assessment_history.json assessment_state.json assessment_log.json
          if git diff --cached --quiet; then
            echo 'No assessment state changes to commit.'
          else
            git commit -m 'Update 3-day flood assessment state'
            git push
          fi
