name: CDRRMO Monitor

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flood-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get latest state
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run flood monitor
        run: python tests/check_facebook.py

      - name: Save monitoring state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add flood_state.json

          if git diff --cached --quiet; then
            echo "No state changes to save."
            exit 0
          fi

          git commit -m "Update flood monitoring state"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase --autostash origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $attempt failed; refreshing remote state."
            sleep 2
          done

          exit 1
