name: PAGASA Radar Monitor

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  radar-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright pillow
          python -m playwright install chromium --with-deps

      - name: Fix Playwright page creation compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("tests/radar_monitor.py")
          s = p.read_text()
          old = "browser=p.chromium.launch(headless=True);page=p.new_page()"
          new = "browser=p.chromium.launch(headless=True);page=browser.new_page()"
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s)
              print("Patched Playwright initialization")
          else:
              print("Playwright initialization already correct")
          PY

      - name: Fix MeteoPilipinas TLS fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("tests/radar_monitor.py")
          s = p.read_text()
          if "import ssl" not in s:
              s = s.replace("import io, json, math, re, subprocess", "import io, json, math, re, subprocess, ssl", 1)
          old = "with urlopen(req,timeout=30) as response:"
          new = "with urlopen(req,timeout=30,context=ssl._create_unverified_context()) as response:"
          if old in s and new not in s:
              s = s.replace(old, new, 1)
              p.write_text(s)
              print("Patched targeted TLS fallback")
          else:
              print("TLS fallback already patched or source changed")
          PY

      - name: Capture PAGASA radar and inspect OpenLayers configuration
        run: python tests/radar_monitor.py

      - name: Calculate radar threat candidates
        run: python tests/radar_threat.py

      - name: Persist latest radar frame and threat state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar_state.json radar_map_state.json radar_threat_state.json radar_data/previous_radar.png
          git diff --cached --quiet || git commit -m "Persist latest PAGASA radar threat state"
          git push

      - name: Upload radar diagnostics
        uses: actions/upload-artifact@v6
        with:
          name: pagasa-radar-${{ github.run_number }}
          path: |
            radar_data/*.png
            radar_data/pagasa_radar_map.js
            radar_state.json
            radar_map_state.json
            radar_threat_state.json
          if-no-files-found: error
          retention-days: 7
