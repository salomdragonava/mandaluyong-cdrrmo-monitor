name: PAGASA Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

# Prevent overlapping runs from racing while updating the cached PAGASA state.
concurrency:
  group: pagasa-monitor
  cancel-in-progress: false

jobs:
  pagasa-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Restore PAGASA monitoring state
        uses: actions/cache/restore@v4
        with:
          path: pagasa_state.json
          key: pagasa-state-${{ github.run_id }}
          restore-keys: |
            pagasa-state-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run PAGASA monitor
        run: python tests/check_pagasa.py

      - name: Send PAGASA Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -s pagasa_alert.txt ]; then
            curl --fail --silent --show-error \
              --request POST \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text@pagasa_alert.txt" \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
          else
            echo "No PAGASA notification due."
          fi

      - name: Save PAGASA monitoring state
        uses: actions/cache/save@v4
        with:
          path: pagasa_state.json
          key: pagasa-state-${{ github.run_id }}
