name: CDRRMO Monitor

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-facebook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get latest state
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run flood monitor
        run: python tests/check_facebook.py

      - name: Send Telegram test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import urllib.request
          import urllib.parse
          import os

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          message = """🟢 CDRRMO Monitor Online

Mandaluyong flood monitoring is connected.

Monitoring:
🔴 P1 Pananalig × Villarica
🔴 P2 Villarica × Nanirahan
🚨 P3 J.P. Rizal × San Pedro
🚨 P4 J.P. Rizal × Ilino Cruz
🚨 P5 J.P. Rizal × Saniboy
🚨 P6 J.P. Rizal × Coronado

Telegram connection test successful."""

          url = f"https://api.telegram.org/bot{token}/sendMessage"

          data = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": message
          }).encode()

          request = urllib.request.Request(
              url,
              data=data,
              method="POST"
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              result = response.read().decode()

          print("Telegram response:", result)
          PY

      - name: Save monitoring state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add flood_state.json

          if git diff --cached --quiet; then
            echo "No state changes to save."
          else
            git commit -m "Update flood monitoring state"
            git push origin main
          fi
