name: Mandaluyong Unified Weather Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: mandaluyong-unified-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore flood monitoring state
        uses: actions/cache/restore@v4
        with:
          path: flood_state.json
          key: flood-state-${{ github.run_id }}
          restore-keys: |
            flood-state-

      - name: Restore radar monitoring state
        uses: actions/cache/restore@v4
        with:
          path: |
            radar_state.json
            radar_map_state.json
            radar_threat_state.json
            radar_notification_state.json
            radar_data/previous_radar.png
          key: radar-state-${{ github.run_id }}
          restore-keys: |
            radar-state-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run PAGASA check
        run: python tests/check_pagasa.py

      - name: Run Mandaluyong flood check
        run: python tests/check_facebook.py

      - name: Install radar dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright pillow
          python -m playwright install chromium --with-deps

      - name: Run lightweight radar check
        run: |
          python tests/radar_light.py
          python tests/radar_threat.py

      - name: Build unified PAGASA-style status
        run: python tests/unified_monitor.py

      - name: Send single scheduled status notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text@combined_alert.txt" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"

      - name: Send escalation notification only when needed
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -s escalation_alert.txt ]; then
            curl --fail --silent --show-error \
              --request POST \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text@escalation_alert.txt" \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
          else
            echo "No meaningful escalation detected."
          fi

      - name: Save radar monitoring state
        uses: actions/cache/save@v4
        with:
          path: |
            radar_state.json
            radar_map_state.json
            radar_threat_state.json
            radar_notification_state.json
            radar_data/previous_radar.png
          key: radar-state-${{ github.run_id }}

      - name: Save monitoring state to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pagasa_state.json flood_state.json monitor_notification_state.json radar_state.json radar_map_state.json radar_threat_state.json radar_notification_state.json
          if git diff --cached --quiet; then
            echo "No repository state changes."
            exit 0
          fi

          git commit -m "Update unified monitoring state"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase --autostash origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $attempt failed; refreshing remote state."
            sleep 2
          done

          echo "Unable to push unified monitoring state after 5 attempts."
          exit 1
