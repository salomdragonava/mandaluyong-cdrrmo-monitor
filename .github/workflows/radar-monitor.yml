name: PAGASA Radar Monitor

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  radar-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright pillow
          python -m playwright install chromium --with-deps

      - name: Capture PAGASA radar and inspect OpenLayers configuration
        run: python tests/radar_monitor.py

      - name: Persist latest radar frame for next run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar_state.json radar_map_state.json radar_data/previous_radar.png
          git diff --cached --quiet || git commit -m "Persist latest PAGASA radar frame"
          git push

      - name: Upload radar diagnostics
        uses: actions/upload-artifact@v6
        with:
          name: pagasa-radar-${{ github.run_number }}
          path: |
            radar_data/*.png
            radar_data/pagasa_radar_map.js
            radar_state.json
            radar_map_state.json
          if-no-files-found: error
          retention-days: 7
