name: Mandaluyong 3-Day Flood Assessment

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

concurrency:
  group: mandaluyong-assessment-monitor
  cancel-in-progress: false

jobs:
  assess:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run rolling 3-day assessment
        run: python tests/assessment_monitor.py
      - name: Commit assessment state
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assessment_history.json assessment_state.json assessment_log.json
          if git diff --cached --quiet; then
            echo 'No assessment state changes to commit.'
          else
            git commit -m 'Update 3-day flood assessment state'
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if git rebase --autostash origin/main; then
                if git push origin HEAD:main; then exit 0; fi
              fi
              git rebase --abort 2>/dev/null || true
              sleep 2
            done
            echo 'Unable to push assessment state after 5 attempts.'
            exit 1
          fi
