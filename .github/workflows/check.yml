name: CDRRMO Monitor

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-facebook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get latest state
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run flood monitor
        run: python tests/check_facebook.py

      - name: Send Telegram alert
        if: ${{ hashFiles('telegram_alert.txt') != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -s telegram_alert.txt ]; then
            curl --fail --silent --show-error \
              --request POST \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text@telegram_alert.txt" \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
          else
            echo "No Telegram alert."
          fi

      - name: Save monitoring state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add flood_state.json

          if git diff --cached --quiet; then
            echo "No state changes to save."
          else
            git commit -m "Update flood monitoring state"
            git push origin main
          fi
