name: Mandaluyong Flood Monitor

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flood-monitor
  cancel-in-progress: false

jobs:
  flood-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Restore flood monitoring state
        uses: actions/cache/restore@v4
        with:
          path: flood_state.json
          key: flood-state-${{ github.run_id }}
          restore-keys: |
            flood-state-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run flood monitor
        run: python tests/check_facebook.py

      - name: Save flood monitoring state
        uses: actions/cache/save@v4
        with:
          path: flood_state.json
          key: flood-state-${{ github.run_id }}
